<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ask Buick | Buick</title>
<meta name="description" content="Ask anything about the Buick SUV lineup.">
<link rel="icon" href="/content/dam/buick/na/us/en/portable-nav/buick-logo-310x89.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<link rel="preconnect" href="https://edge.api.brightcove.com">
<link rel="stylesheet" href="/ace/ace-tokens.css">
<link rel="stylesheet" href="/ace/chat.css">
<link rel="stylesheet" href="/ace/ace-bar.css">
<link rel="preload" as="image" href="/ace/img/buick-logo.png">
</head>
<body>
  <div class="ace-page">
    <header class="ace-header">
      <span class="ace-header__logo" role="img" aria-label="Buick AI"><img src="/ace/icons/ai.svg" alt="" width="24" height="24"></span>
      <a class="ace-header__brand" href="/" aria-label="Buick home"><img src="/ace/img/buick-logo.png" alt="Buick" width="155" height="44"></a>
      <button class="ace-iconbtn ace-close" type="button" aria-label="Close"><img src="/ace/icons/close.svg" alt="" width="16" height="16"></button>
    </header>
    <main class="ace-thread" id="ace-thread" aria-live="polite"></main>
  </div>

  <form class="ace-bar" action="/chat" method="get" role="search" aria-label="Ask Buick">
    <div class="ace-bar__row">
      <label class="ace-visually-hidden" for="ace-chat-input">Ask me anything</label>
      <input id="ace-chat-input" class="ace-bar__input" type="text" name="q" placeholder="Ask me anything" autocomplete="off" enterkeyhint="send" maxlength="300">
      <button class="ace-bar__send" type="submit" aria-label="Send" disabled><img src="/ace/icons/arrow-up.svg" alt="" width="16" height="16"></button>
    </div>
  </form>

  <script src="/ace/ace-bar.js"></script>
  <script src="/ace/engine.js"></script>
  <script src="/ace/chat.js"></script>
</body>
</html>
